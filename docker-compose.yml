services:
  postgres:
    image: postgres:16-alpine
    container_name: arkho_postgres
    restart: always
    environment:
      POSTGRES_USER: arkho_user
      POSTGRES_PASSWORD: arkho_password
      POSTGRES_DB: arkho_db
    ports:
      - '5439:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arkho_user -d arkho_db']
      interval: 5s
      timeout: 5s
      retries: 5

